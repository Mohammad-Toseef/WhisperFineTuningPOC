model:
  name: "openai/whisper-large-v3"   # POC base model (1.5B params, 128 mel bins)
  language: "ur"           # Primary language token
  task: "transcribe"

lora:
  # ── ROUND 2: continue round 1's adapter, do NOT build a fresh one ──
  # base large-v3 + this adapter IS the round-1 model (the base was frozen all
  # through round 1), so step 0 reproduces round 1's outputs exactly.
  # Unset this to go back to round 1's behaviour (a fresh adapter on the base).
  # NOTE: when set, r / lora_alpha / target_modules below are NOT used to build
  # the adapter — they come from the adapter's own adapter_config.json. They are
  # still read, and a mismatch is reported, because the values that actually
  # train are the adapter's.
  resume_from_adapter: "/data/model/whisper-urdu-lora-adapter"
  r: 32
  lora_alpha: 64
  # Tier 2 (full run): attention (q/k/v/out) + MLP (fc1/fc2). The MLP targets are
  # the lexical/vocabulary lever needed to learn domain/spiritual terms and the
  # izafat ( ِ ) mark; attention alone (q/v, the smoke-test config) only adapts
  # accent/pacing. ~3-4% trainable vs 1.0% at Tier 1.
  target_modules: ["q_proj", "k_proj", "v_proj", "out_proj", "fc1", "fc2"]
  lora_dropout: 0.05
  # task_type MUST be null for Whisper. Setting SEQ_2_SEQ_LM makes PEFT feed
  # `input_ids` to the base model, but Whisper.forward() takes `input_features`.
  task_type: null

audio:
  sampling_rate: 16000
  max_duration_seconds: 30
  min_duration_seconds: 1

training:
  # ── run_tag: versions EVERY artifact this run produces ──
  # Round 1 wrote to the untagged paths and its adapter is this run's resume
  # SOURCE, so without a tag the trainer would overwrite the adapter it is
  # resuming from, and evaluate() would overwrite the eval_results.json holding
  # round 1's 18.57% / 10.50%. Empty/unset reproduces round 1's layout.
  #   adapter -> /data/model/whisper-urdu-r2-lora-adapter
  #   merged  -> /data/model/whisper-urdu-r2-final
  #   eval    -> /data/logs/eval_results-r2-*.json
  run_tag: "r2"

  # Tagged so round 1's checkpoints/logs are not mixed into this run's.
  output_dir: "/data/checkpoints/whisper-large-v3-urdu-r2"   # r1: .../whisper-large-v3-urdu
  logging_dir: "/data/logs/r2"                               # r1: /data/logs

  per_device_train_batch_size: 8   # large-v3 on A10G 24GB; drop to 4 if OOM
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4   # Effective batch = 32

  # ── learning_rate: HALVED from round 1's 1.0e-5 ──
  # Round 1 started from scratch, so there was nothing to preserve and large
  # updates were free. Round 2 starts from a model that already knows this
  # domain, and large updates can OVERWRITE that — the forgetting risk. 5.0e-6
  # trades some speed at learning Batch 3's code-switching for keeping round 1's
  # spiritual_term result (9.38%).
  # This is a judgement call, and it is FALSIFIABLE at epoch 1: watch
  # `eval_wer_r1` (change #6).
  # ⚠️ COMPARE IT AGAINST 15.71%, **NOT** 10.50%. compute_metrics reports RAW WER;
  # the 10.50% headline is evaluate()'s NORMALIZED number, and on identical
  # outputs raw 15.68% == normalized 10.50%. Round 1's RAW per-epoch curve on
  # Set A was 21.16/17.69/16.42/16.05/15.78/15.71*/15.98/15.90/15.89 (base raw
  # 23.87%). So: ~15.7-16.0 = round 1 preserved; >17 = concerning; ~20+ = real
  # forgetting, stop and lower the rate (~1.5 h, not the run).
  # MEASURED round 2, epoch 1: eval_wer_r1 = 15.80 raw -> preserved.
  learning_rate: 5.0e-6

  # ── Step schedule (step-based; no num_train_epochs) ──
  #   steps_per_epoch = ceil(n_train_clips / 32)      # eff-batch = 8 * 4
  #   max_steps       = steps_per_epoch * n_epochs
  # History: smoke test 535 clips -> ~15/epoch -> 120 (~8 ep).
  #          49-ep run 2011 clips -> 63/epoch -> 567 (~9 ep); BEST WAS EPOCH 6,
  #          and 7-9 were slightly worse — the overfitting curve made visible.
  # ROUND 2: 8123 train clips -> ceil(8123/32) = 254/epoch -> 762 (3 epochs).
  # Fewer epochs than round 1 on purpose: this starts from a trained model AND
  # has ~4x the data, so one epoch here teaches far more than one epoch there.
  max_steps: 762
  warmup_steps: 76   # ~10% of max_steps — small updates first so the opening
                     # steps cannot jolt the resumed adapter

  gradient_checkpointing: true
  fp16: true
  evaluation_strategy: "steps"
  # Once per epoch => 3 evals. save_steps must stay a multiple of eval_steps or
  # load_best_model_at_end cannot find the best checkpoint.
  eval_steps: 254
  save_steps: 254
  save_total_limit: 3
  load_best_model_at_end: true
  # The BLENDED wer, deliberately: the eval split spans two corpora and a
  # checkpoint should be good at both. `wer_r1` / `wer_b3` are reported
  # alongside it for reading, not for selection.
  metric_for_best_model: "wer"
  greater_is_better: false
  predict_with_generate: true
  generation_max_length: 225
  logging_steps: 25
  report_to: "tensorboard"

data:
  # Vestigial: dataset_builder does the splitting (whole-episode holdout) and
  # writes both splits to disk. Kept so older configs still parse.
  train_split: 0.90
  eval_split: 0.10
  # Round 2's dataset: Batch 3 train + a combined (Set B + Set A) eval split.
  # MUST be the tagged path — pointing at round 1's /processed/dataset destroys
  # nothing and produces a plausible result, which is the one silent failure a
  # run_tag cannot catch. train() warns if this looks untagged.
  dataset_path: "/data/processed/dataset_r2"                  # r1: /data/processed/dataset